name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'KernelSU / Root Setup Option'
        required: true
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'enabled'
  push:
    branches:
      - common
      - Github-actions-fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🧹 Cleanup Workspace
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          echo "[*] Disk space cleaned."

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential libssl-dev libncurses5-dev libncurses-dev \
            bison flex libelf-dev bc ccache zip unzip curl wget rsync jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 🗄️ Cache Toolchain
        uses: actions/cache@v4
        id: cache-clang
        with:
          path: clang/
          key: ${{ runner.os }}-zyc-clang-17.0.0-v1
          restore-keys: |
            ${{ runner.os }}-zyc-clang-17.0.0-

      - name: 📥 Fetch Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230911-release/Clang-17.0.0-20230911-release.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang/
          rm clang.tar.gz

      - name: 📥 Fetch AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: 🔨 Build AuraX
        shell: bash
        run: |
          # ── Toolchain paths ────────────────────────────────────────────────
          TC_DIR="${GITHUB_WORKSPACE}/clang/bin"

          # System host tools — MUST point to system gcc/ld
          SYS_GCC=$(which gcc)
          SYS_GXX=$(which g++)
          SYS_LD=$(which ld)

          echo "[*] Clang Version: $($TC_DIR/clang --version | head -1)"
          echo "[*] Host GCC:       $SYS_GCC"
          echo "[*] Host LD:        $SYS_LD"

          # ── Optional KernelSU Logic ─────────────────────────────────────────
          KSU_STATUS="${{ inputs.ksu_option }}"
          echo "[*] KernelSU Option: ${KSU_STATUS:-disabled}"

          if [ "$KSU_STATUS" = "enabled" ]; then
            if [ -d "drivers/kernelsu" ]; then
              echo "[*] Enabling KernelSU in Makefile and Kconfig..."
              sed -i 's|^# *obj-$(CONFIG_KSU) *+= *kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' drivers/Makefile || true
              sed -i 's|^# *source "drivers/kernelsu/Kconfig"|source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig || true
            fi
          fi

          # ── Comprehensive Make arguments ────────────────────────────────────
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64

            # Complete Target Toolchain Tools
            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            OBJSIZE="$TC_DIR/llvm-size"
            LLVM_AR="$TC_DIR/llvm-ar"
            LLVM_DIS="$TC_DIR/llvm-dis"

            # Host Tools pointing directly to system binaries
            HOSTCC="$SYS_GCC"
            HOSTCXX="$SYS_GXX"
            HOSTLD="$SYS_LD"
            HOSTAR="/usr/bin/ar"
            HOSTSTRIP="/usr/bin/strip"

            # Cross compile prefixes
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CLANG_TRIPLE="aarch64-linux-gnu-"

            # LLVM flags (Disables integrated assembler for inline asm compatibility)
            LLVM=1
            LLVM_IAS=0

            # Optimizations and Warning Flags
            KCFLAGS="-w -pipe -O2 -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # ── Configure Kernel ────────────────────────────────────────────────
          echo "[*] Configuring with a32_github_defconfig..."
          make "${MAKE_ARGS[@]}" a32_github_defconfig

          if [ "$KSU_STATUS" = "enabled" ]; then
            echo "CONFIG_KSU=y" >> out/.config
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          # ── Compilation Process ────────────────────────────────────────────
          JOBS=$(nproc --all)
          echo "[*] Starting compilation with $JOBS threads..."
          make -j"$JOBS" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "[*] Build completed. Checking output files:"
          ls -lh out/arch/arm64/boot/ || true

      - name: 🛠️ Prepare AnyKernel3
        run: |
          # Copy the compiled kernel image to the AnyKernel3 directory
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi

          # Copy DTBO image if generated by the build process
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          # Copy DTB image if generated separately
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AnyKernel3/
          elif [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb AnyKernel3/
          fi

      - name: 📦 Build AK3 Zip
        run: |
          cd AnyKernel3
          zip -r9 ../A32-Kernel-AK3.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "README.md"

      - name: 📤 Upload AK3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-AK3-${{ github.sha }}
          path: A32-Kernel-AK3.zip
          if-no-files-found: error
