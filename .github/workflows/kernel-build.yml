name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'KernelSU / Root Setup Option'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'ksu'
          - 'susfs'
  push:
    branches:
      - common

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🗄️ Cache Neutron Toolchain
        uses: actions/cache@v4
        id: cache-clang
        with:
          path: clang/
          key: ${{ runner.os }}-neutron-clang-v1
          restore-keys: |
            ${{ runner.os }}-neutron-clang-

      - name: ⚙️ Setup Environment & Clang
        uses: ./.github/actions/setup-clang

      - name: 🔨 Build AuraX Kernel
        shell: bash
        run: |
          # ── Toolchain setup ──────────────────────────────────────────────────
          TC_DIR="${GITHUB_WORKSPACE}/clang/bin"

          SYS_GCC=$(which gcc)
          SYS_GXX=$(which g++)
          SYS_LD=$(which ld)

          echo "[*] Using Clang Version: $($TC_DIR/clang --version | head -n1)"
          echo "[*] Using Host GCC: $SYS_GCC"

          # ── Build Flags & Toolchain Definitions ──────────────────────────────
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64

            # LLVM / Clang Target Tools
            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            OBJSIZE="$TC_DIR/llvm-size"

            # Host Environment Tools (System Binaries)
            HOSTCC="$SYS_GCC"
            HOSTCXX="$SYS_GXX"
            HOSTLD="$SYS_LD"
            HOSTAR="/usr/bin/ar"
            HOSTSTRIP="/usr/bin/strip"

            # Target Cross-Compiler Prefixes
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CLANG_TRIPLE="aarch64-linux-gnu-"

            # Assembler Logic (LLVM IAS disabled for legacy MediaTek asm inline compat)
            LLVM=1
            LLVM_IAS=0

            # Optimizations and Warnings
            KCFLAGS="-O2 -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # ── Defconfig Generation ─────────────────────────────────────────────
          echo "[*] Generating defconfig..."
          make "${MAKE_ARGS[@]}" a32_github_defconfig

          # ── Handle KernelSU / SUSFS Choice Input ──────────────────────────────
          KSU_CHOICE="${{ inputs.ksu_option }}"
          echo "[*] Selected KernelSU Option: ${KSU_CHOICE:-none}"

          if [ "$KSU_CHOICE" = "ksu" ]; then
            echo "[*] Injecting standard KernelSU configs..."
            echo "CONFIG_KSU=y" >> out/.config
          elif [ "$KSU_CHOICE" = "susfs" ]; then
            echo "[*] Injecting KernelSU + SUSFS configs..."
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KSU_SUSFS=y" >> out/.config
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> out/.config
          fi

          if [ "$KSU_CHOICE" != "none" ] && [ -n "$KSU_CHOICE" ]; then
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          # ── Main Compilation Step ───────────────────────────────────────────
          JOBS=$(nproc --all)
          echo "[*] Compiling kernel on $JOBS threads..."
          make -j"$JOBS" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "[*] Build finished successfully. Checking outputs:"
          ls -lh out/arch/arm64/boot/ || true

      - name: 🛠️ Prepare AnyKernel3 Output
        run: |
          if [ -d "AnyKernel3" ]; then
            if [ -f "out/arch/arm64/boot/Image" ]; then
              cp out/arch/arm64/boot/Image AnyKernel3/
            fi
            if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3/
            fi
          else
            echo "[!] AnyKernel3 directory not found, skipping move."
          fi

      - name: 📦 Compress AK3 Artifact
        if: directory_exists == true || hashFiles('AnyKernel3/*') != ''
        run: |
          cd AnyKernel3
          zip -r9 ../A32-Kernel-AK3.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "README.md"

      - name: 📤 Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-${{ github.sha }}
          path: A32-Kernel-AK3.zip
          if-no-files-found: error
