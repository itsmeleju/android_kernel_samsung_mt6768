name: A32 Kernel Builder by NoobieThingZ

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'KernelSU / Root Setup Option'
        required: true
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'enabled'
  push:
    branches:
      - Github-actions-fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🗄️ Cache Toolchain
        uses: actions/cache@v4
        id: cache-clang
        with:
          path: clang/
          key: ${{ runner.os }}-neutron-clang-v1
          restore-keys: |
            ${{ runner.os }}-neutron-clang-

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-clang

      - name: 🔨 Build Kernel
        shell: bash
        run: |
          # ── Toolchain paths ────────────────────────────────────────────────
          TC_DIR="${GITHUB_WORKSPACE}/clang/bin"

          SYS_GCC=$(which gcc)
          SYS_GXX=$(which g++)
          SYS_LD=$(which ld)

          echo "[*] Using Clang Version: $($TC_DIR/clang --version | head -n1)"
          echo "[*] Using Host GCC: $SYS_GCC"

          # ── Configure KernelSU in Source Files ─────────────────────────────
          KSU_STATUS="${{ inputs.ksu_option }}"
          echo "[*] Processing KernelSU Option: ${KSU_STATUS:-disabled}"

          if [ "$KSU_STATUS" = "enabled" ]; then
            echo "[*] Enabling KernelSU in drivers/Makefile and drivers/Kconfig..."
            
            # Uncomment in drivers/Makefile
            sed -i 's|^# *obj-$(CONFIG_KSU) *+= *kernelsu/|obj-$(CONFIG_KSU) += kernelsu/|g' drivers/Makefile
            
            # Uncomment in drivers/Kconfig
            sed -i 's|^# *source "drivers/kernelsu/Kconfig"|source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig

          else
            echo "[*] Disabling KernelSU in drivers/Makefile and drivers/Kconfig..."
            
            # Comment out in drivers/Makefile
            sed -i 's|^obj-$(CONFIG_KSU) *+= *kernelsu/|# obj-$(CONFIG_KSU) += kernelsu/|g' drivers/Makefile
            
            # Comment out in drivers/Kconfig
            sed -i 's|^source "drivers/kernelsu/Kconfig"|# source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig
          fi

          # ── Make Arguments ─────────────────────────────────────────────────
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64

            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            OBJSIZE="$TC_DIR/llvm-size"

            HOSTCC="$SYS_GCC"
            HOSTCXX="$SYS_GXX"
            HOSTLD="$SYS_LD"
            HOSTAR="/usr/bin/ar"
            HOSTSTRIP="/usr/bin/strip"

            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CLANG_TRIPLE="aarch64-linux-gnu-"

            LLVM=1
            LLVM_IAS=0

            KCFLAGS="-O2 -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # ── Configure & Build ──────────────────────────────────────────────
          echo "[*] Generating defconfig..."
          make "${MAKE_ARGS[@]}" a32_github_defconfig

          if [ "$KSU_STATUS" = "enabled" ]; then
            echo "CONFIG_KSU=y" >> out/.config
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          JOBS=$(nproc --all)
          echo "[*] Compiling kernel using $JOBS threads..."
          make -j"$JOBS" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

      - name: 🛠️ Prepare AnyKernel3
        run: |
          if [ -d "AnyKernel3" ]; then
            if [ -f "out/arch/arm64/boot/Image" ]; then
              cp out/arch/arm64/boot/Image AnyKernel3/
            fi
            if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
              cp out/arch/arm64/boot/dtbo.img AnyKernel3/
            fi
          fi

      - name: 📦 Build AK3 Zip
        run: |
          cd AnyKernel3
          zip -r9 ../A32-Kernel-AK3.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "README.md"

      - name: 📤 Upload AK3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: A32-Kernel-${{ github.sha }}
          path: A32-Kernel-AK3.zip
          if-no-files-found: error
