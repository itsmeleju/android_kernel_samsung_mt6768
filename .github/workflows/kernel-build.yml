name: NoobieKernel Builder-v2 by NoobieThingZ

on:
  workflow_dispatch:
    inputs:
      ksu_option:
        description: 'KernelSU / ReSukiSU Setup Option'
        required: true
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'enabled'
      localversion:
        description: 'Custom Localversion (e.g. -NoobieKernel_v1)'
        required: false
        default: '-NoobieKernel_v1'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 1

      - name: 🧹 Cleanup Workspace
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          echo "[*] Disk space cleaned."

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential libssl-dev libncurses5-dev libncurses-dev \
            bison flex libelf-dev bc ccache zip unzip curl wget rsync jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 🗄️ Cache Toolchain
        uses: actions/cache@v4
        id: cache-clang
        with:
          path: clang/
          key: ${{ runner.os }}-aosp-clang-r488900-v1
          restore-keys: |
            ${{ runner.os }}-aosp-clang-r488900-

      - name: 📥 Fetch Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang/
          rm clang.tar.gz

      - name: 🧹 Prepare Existing AnyKernel3 Folder
        run: |
          echo "[*] Using pre-existing AnyKernel3 directory from repository..."
          rm -f AnyKernel3/*.zip AnyKernel3/Image* AnyKernel3/dtb* AnyKernel3/dtbo* || true

 # ── Conditional ReSukiSU Setup (Runs resukisu action) ──
      - name: Execute ReSukiSU Integration
        if: ${{ inputs.ksu_option == 'enabled' }}
        uses: ./.github/actions/resukisu
        with:
          kernel-dir: '.'
          defconfig-path: 'arch/arm64/configs/a32_github_defconfig'

      # ── Decide Defconfig based on input ──
      - name: Select Defconfig
        id: select-config
        run: |
          if [ "${{ inputs.ksu_option }}" = "enabled" ]; then
            echo "DEFCONFIG_NAME=a32_github_defconfig" >> "$GITHUB_ENV"
          else
            echo "DEFCONFIG_NAME=a32_noksu_defconfig" >> "$GITHUB_ENV"
          fi
          
      - name: 🔨 Build AuraX
        shell: bash
        run: |
          # Ensure host binaries (/usr/bin) are prioritized for HOST tools
          export PATH="/usr/bin:${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          TC_DIR="${GITHUB_WORKSPACE}/clang/bin"

          echo "[*] Clang Version: $($TC_DIR/clang --version | head -1)"

          # ── Comprehensive Make arguments ────────────────────────────────────
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64

            # Complete Target Toolchain Tools
            CC="$TC_DIR/clang"
            LD="$TC_DIR/ld.lld"
            AR="$TC_DIR/llvm-ar"
            NM="$TC_DIR/llvm-nm"
            OBJCOPY="$TC_DIR/llvm-objcopy"
            OBJDUMP="$TC_DIR/llvm-objdump"
            STRIP="$TC_DIR/llvm-strip"
            READELF="$TC_DIR/llvm-readelf"
            OBJSIZE="$TC_DIR/llvm-size"
            LLVM_AR="$TC_DIR/llvm-ar"
            LLVM_DIS="$TC_DIR/llvm-dis"

            # Host Tools (Explicitly pointed to system binaries)
            HOSTCC=/usr/bin/gcc
            HOSTCXX=/usr/bin/g++
            HOSTLD=/usr/bin/ld
            HOSTAR=/usr/bin/ar

            # Cross compile prefixes
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
            CLANG_TRIPLE="aarch64-linux-gnu-"

            # LLVM flags
            LLVM=1
            LLVM_IAS=0

            # Optimizations and Warning Flags
            KCFLAGS="-w -pipe -O2 -Wno-error"
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          )

          mkdir -p out

          # ── Configure Kernel ────────────────────────────────────────────────
          echo "[*] Configuring with ${DEFCONFIG_NAME}..."
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_NAME}"

          # ── Configure Localversion & KernelSU ────────────────────────────────
          LOCALVER="${{ inputs.localversion }}"
          LOCALVER="${LOCALVER:--NoobieKernel_v1}"
          if [ -n "$LOCALVER" ]; then
            echo "[*] Setting CONFIG_LOCALVERSION=\"${LOCALVER}\"..."
            sed -i '/CONFIG_LOCALVERSION=/d' out/.config
            echo "CONFIG_LOCALVERSION=\"${LOCALVER}\"" >> out/.config
          fi

          if [ "$KSU_STATUS" = "enabled" ]; then
            echo "CONFIG_KSU=y" >> out/.config
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          # ── Compilation Process ────────────────────────────────────────────
          JOBS=$(nproc --all)
          echo "[*] Starting compilation with $JOBS threads..."
          make -j"$JOBS" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

          echo "[*] Build completed. Checking output files:"
          ls -lh out/arch/arm64/boot/ || true

      - name: 🛠️ Prepare AnyKernel3
        run: |
          # Clean and prepare workspace
          rm -rf AnyKernel3 tmp_ak3
          mkdir -p tmp_ak3 AnyKernel3

          # Extract AnyKernel3.zip
          unzip -q AnyKernel3.zip -d tmp_ak3

          # Flatten folder structure so anykernel.sh is always in AnyKernel3/ root
          AK3_ROOT=$(find tmp_ak3 -type f -name "anykernel.sh" -exec dirname {} \;)
          cp -r "${AK3_ROOT}"/* AnyKernel3/
          rm -rf tmp_ak3

          # Copy raw uncompressed Image directly alongside anykernel.sh
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            # Decompress Image.gz to raw Image if only Image.gz is available
            gzip -dc out/arch/arm64/boot/Image.gz > AnyKernel3/Image
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            gzip -dc out/arch/arm64/boot/Image.gz-dtb > AnyKernel3/Image
          fi

          # Copy DTBO image if generated by the build process
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          # Copy DTB image if generated separately
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AnyKernel3/
          elif [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb AnyKernel3/
          fi

      - name: 📦 Build AK3 Zip
        id: build_zip
        run: |
          DATE=$(date +'%m%d')
          LOCAL_VER="${{ inputs.localversion }}"
          ZIP_NAME="A32-GA-${DATE}-${LOCAL_VER}.zip"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . \
            -x "*.git*" \
            -x "*.github*" \
            -x "README.md"

      - name: 📤 Upload AK3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
